# Tokyo Night: ночной город, холмы под луной, плавающая панель.
version: 1
name: tokyo-night
description: Ночные синие тона, плавающая панель сверху, холмы под луной
theme:
  palette:
    bg: "#1a1b26"
    fg: "#c0caf5"
    accent: "#7aa2f7"
    ansi: ["#15161e", "#f7768e", "#9ece6a", "#e0af68", "#7aa2f7", "#bb9af7", "#7dcfff", "#a9b1d6",
           "#414868", "#f7768e", "#9ece6a", "#e0af68", "#7aa2f7", "#bb9af7", "#7dcfff", "#c0caf5"]
  fonts: { ui: "Inter", mono: "JetBrainsMono Nerd Font", size: 11 }
  geometry: { gaps: 8, border: 2, radius: 10, opacity: 0.92 }
  style: { shape: rounded, bar: islands, separators: none, borders: gradient, density: normal, labels: glyphs, glass: light }
  wallpaper: { generate: hills }
components:
  compositor: hyprland
  bar: quickshell
  terminal: kitty
  wallpaper: swww
  launcher: fuzzel
  notifications: qs-notifications
  power: wlogout
  widgets: qs-desktop
  lock: hyprlock
  idle: hypridle
  screenshot: grim
  clipboard: cliphist
  polkit: hyprpolkitagent
  gtk: gtk
  qt: qt
  files: thunar
  terminal_files: yazi
  images: imv
  shell: zsh
  fetch: fastfetch
  monitor: btop
  editor: neovim
  nightlight: hyprsunset
  recorder: recorder
  picker: hyprpicker
  emoji: rofimoji
overrides:
  quickshell: { style: segments }
  hyprland: { animations: snappy, kb_layout: "us,ru" }
  waybar:
    modules_left: [launcher, workspaces, window]
    modules_center: [clock]
    modules_right: [media, pulseaudio, network, battery, calculator, tray, power]
