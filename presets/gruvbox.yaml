# Gruvbox: тёплые ретро-цвета, острые углы, панель вплотную к краю.
version: 1
name: gruvbox
description: Тёплые ретро-цвета, острые углы, строгая панель сверху
theme:
  palette:
    bg: "#282828"
    fg: "#ebdbb2"
    accent: "#fe8019"
    ansi: ["#282828", "#cc241d", "#98971a", "#d79921", "#458588", "#b16286", "#689d6a", "#a89984",
           "#928374", "#fb4934", "#b8bb26", "#fabd2f", "#83a598", "#d3869b", "#8ec07c", "#ebdbb2"]
  fonts: { ui: "Iosevka Nerd Font", mono: "Iosevka Nerd Font", size: 11 }
  geometry: { gaps: 6, border: 3, radius: 0, opacity: 1.0 }
  style: { shape: sharp, bar: solid, separators: arrows, borders: thin, density: compact, labels: text, glass: none }
  wallpaper: { generate: rings }
components:
  compositor: hyprland
  bar: quickshell
  terminal: alacritty
  wallpaper: swaybg
  launcher: fuzzel
  notifications: qs-notifications
  power: power-menu
  lock: hyprlock
  idle: hypridle
  screenshot: grim
  clipboard: cliphist
  polkit: hyprpolkitagent
  gtk: gtk
  qt: qt
  files: thunar
  terminal_files: yazi
  images: imv
  shell: zsh
  fetch: fastfetch
  monitor: btop
  editor: neovim
  nightlight: hyprsunset
  recorder: recorder
  picker: hyprpicker
  emoji: rofimoji
overrides:
  qs-desktop: { style: soft }
  quickshell: { style: rail }
  hyprland: { animations: snappy, kb_layout: "us,ru" }
  waybar:
    modules_left: [workspaces, window]
    modules_center: []
    modules_right: [cpu, memory, pulseaudio, network, battery, language, clock]
