# Catppuccin Mocha: мягкие пастельные цвета, плавные анимации.
version: 1
name: catppuccin-mocha
description: Пастельные цвета, мягкие скругления, волны и панель снизу
theme:
  palette:
    bg: "#1e1e2e"
    fg: "#cdd6f4"
    accent: "#cba6f7"
    ansi: ["#45475a", "#f38ba8", "#a6e3a1", "#f9e2af", "#89b4fa", "#f5c2e7", "#94e2d5", "#bac2de",
           "#585b70", "#f38ba8", "#a6e3a1", "#f9e2af", "#89b4fa", "#f5c2e7", "#94e2d5", "#a6adc8"]
  fonts: { ui: "Inter", mono: "FiraCode Nerd Font", size: 11 }
  geometry: { gaps: 10, border: 2, radius: 14, opacity: 0.94 }
  style: { shape: pill, bar: islands, separators: none, borders: accent, density: spacious, labels: glyphs, glass: strong }
  wallpaper: { generate: waves }
components:
  compositor: hyprland
  bar: quickshell
  terminal: ghostty
  wallpaper: swww
  launcher: rofi
  notifications: qs-notifications
  power: wlogout
  widgets: qs-desktop
  lock: hyprlock
  idle: hypridle
  screenshot: grim
  clipboard: cliphist
  polkit: hyprpolkitagent
  gtk: gtk
  qt: qt
  files: thunar
  terminal_files: yazi
  images: imv
  shell: zsh
  fetch: fastfetch
  monitor: btop
  editor: neovim
  nightlight: hyprsunset
  recorder: recorder
  picker: hyprpicker
  emoji: rofimoji
overrides:
  qs-desktop: { style: glass }
  quickshell: { style: island }
  hyprland: { animations: smooth, kb_layout: "us,ru" }
  waybar:
    position: bottom
    modules_left: [launcher, workspaces]
    modules_center: [clock]
    modules_right: [cpu, memory, pulseaudio, network, battery, power]
