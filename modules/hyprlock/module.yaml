# Модуль hyprlock: экран блокировки (Super+L или автоматически через hypridle).
id: hyprlock
role: lock
exec: hyprlock
packages: [hyprlock]
binds:
  - "$mod, L, exec, pidof hyprlock || {{ exec }}"
compatible_with:
  compositor: [hyprland]
templates:
  - src: hyprlock.conf.tera
    dest: ~/.config/hypr/hyprlock.conf
settings:
  - id: blur
    group: Экран блокировки
    title: Размытие обоев
    about: 0 — обои как есть.
    range: [0, 6]
    default: 3
  - id: brightness
    group: Экран блокировки
    title: Яркость обоев
    range: [0.2, 1]
    step: 0.1
    default: 0.6
  - id: seconds
    group: Экран блокировки
    title: Секунды на часах
    default: false
