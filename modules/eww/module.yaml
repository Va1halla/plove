# Модуль eww: виджет на рабочем столе — большие часы, дата и загрузка
# системы поверх обоев. eww умеет и панели, но здесь только «украшение».
id: eww
role: widgets
# Карточки из plove studio — отдельные окна desktop, desktop1, desktop2…
exec: "{% if desk | length > 0 %}eww open-many{% for c in desk %} {{ c.window }}{% endfor %}{% else %}eww open desktop{% endif %}"
# Собирается из AUR; paru поставит его и если пакет появится в репозитории.
aur: [eww]
compatible_with:
  compositor: [hyprland]
templates:
  - src: eww.yuck.tera
    dest: ~/.config/eww/eww.yuck
  - src: eww.scss.tera
    dest: ~/.config/eww/eww.scss
  - src: desk-weather.sh.tera
    dest: ~/.local/share/plove/desk-weather.sh
  - src: desk-cover.sh.tera
    dest: ~/.local/share/plove/desk-cover.sh
autostart: true
# `eww open` сам запускает фоновый процесс eww, если его ещё нет.
# Набор окон мог поменяться, поэтому закрываем все и открываем заново.
reload: "{% if desk | length > 0 %}eww close-all >/dev/null 2>&1; eww open-many{% for c in desk %} {{ c.window }}{% endfor %}{% else %}pgrep -x eww >/dev/null && eww reload || eww open desktop{% endif %}"
# Именно этот eww: у выпадающих меню (eww-popups) свой процесс eww.
# Шаблон для pkill -f: и «eww open desktop», и «eww open-many desktop …».
process: "eww open.* desktop"
settings:
  - id: cards
    group: Рабочий стол
    title: Карточки
    about: "Если в райсе есть desktop (раскладка из plove studio), эти три настройки не действуют. Что лежит на рабочем столе, сверху вниз: clock (часы и дата), system (процессор, память, диск), media (музыка с кнопками) или свои виджеты из widgets."
    items: [clock, system, media]
    default: [clock, system]
  - id: anchor
    group: Рабочий стол
    title: Где на экране
    choices: [center, top-left, top-right, bottom-left, bottom-right, left, right]
    default: center
  - id: clock_size
    group: Рабочий стол
    title: Размер часов, px
    range: [48, 200]
    step: 4
    default: 110
