# Модуль Ghostty: новый быстрый терминал. Альтернатива kitty.
id: ghostty
role: terminal
exec: ghostty
run_in: ghostty -e
packages: [ghostty]
templates:
  - src: config.tera
    dest: ~/.config/ghostty/config
user_files:
  - ~/.config/ghostty/user.conf
binds:
  - "$mod, Return, exec, {{ exec }}"
# Настройки: мастер показывает их на экране «Тонкая настройка», `plove modules ghostty` — списком.
settings:
  - id: cursor_shape
    group: Терминал
    title: Форма курсора
    choices: [block, beam, underline]
    default: block
  - id: cursor_blink
    group: Терминал
    title: Мигающий курсор
    default: true
  - id: padding
    group: Терминал
    title: Отступ текста от края, px
    range: [0, 40]
    step: 2
    default: 8
  - id: colors
    group: Цвета терминала
    title: Цветовая схема
    about: rice — цвета райса. Или любая другая схема, независимо от райса.
    choices: [rice, tokyo-night, catppuccin-mocha, gruvbox, nord, dracula, rose-pine, everforest, kanagawa, one-dark, solarized-dark, catppuccin-latte]
    default: rice
  - id: background
    group: Цвета терминала
    title: Фон
    about: scheme — фон схемы; darker и lighter — темнее или светлее его; rice — фон райса под цветами схемы.
    choices: [scheme, darker, lighter, rice]
    default: scheme
