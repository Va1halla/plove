# Модуль gtk: тёмная тема, шрифт и иконки для обычных программ (Thunar,
# Firefox, диалоги открытия файлов), чтобы они не выглядели чужими.
id: gtk
role: gtk
packages: [gnome-themes-extra, papirus-icon-theme, adwaita-cursors]
templates:
  - src: settings.ini.tera
    dest: ~/.config/gtk-3.0/settings.ini
  - src: settings.ini.tera
    dest: ~/.config/gtk-4.0/settings.ini
  - src: gtk.css.tera
    dest: ~/.config/gtk-3.0/gtk.css
  - src: gtk.css.tera
    dest: ~/.config/gtk-4.0/gtk.css
# GTK4/libadwaita читает тёмный режим из gsettings, а не из settings.ini.
on_apply:
  - "gsettings set org.gnome.desktop.interface color-scheme prefer-dark"
  - "gsettings set org.gnome.desktop.interface gtk-theme Adwaita-dark"
  - "gsettings set org.gnome.desktop.interface icon-theme {{ options.icons }}"
  - "gsettings set org.gnome.desktop.interface font-name '{{ fonts.ui }} {{ fonts.size }}'"
  - "gsettings set org.gnome.desktop.interface cursor-theme Adwaita"
  - "gsettings set org.gnome.desktop.interface cursor-size {{ options.cursor_size }}"
# Один курсор везде: в Hyprland, GTK и старых X11-программах.
env:
  - "XCURSOR_THEME,Adwaita"
  - "XCURSOR_SIZE,{{ options.cursor_size }}"
# Настройки: мастер показывает их на экране «Тонкая настройка», `plove modules gtk` — списком.
settings:
  - id: cursor_size
    group: Внешний вид
    title: Размер курсора
    about: 24 — обычный, 32–48 — для 4K или если курсор теряется.
    range: [16, 64]
    step: 8
    default: 24
  - id: icons
    group: Внешний вид
    title: Значки
    about: Papirus — яркие и узнаваемые, Adwaita — стандартные значки GNOME.
    choices: [Papirus-Dark, Adwaita]
    default: Papirus-Dark
