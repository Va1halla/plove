# Модуль power-menu: меню «заблокировать / выйти / перезагрузить / выключить»
# по Super+Shift+E. Своей программы нет: меню рисует лаунчер (fuzzel или rofi).
id: power-menu
role: power
exec: >-
  case $(printf 'Заблокировать\nВыйти\nПерезагрузить\nВыключить' | {{ dmenu }}) in
  Заблокировать) pidof hyprlock || hyprlock ;;
  Выйти) {{ hyprctl.exit }} ;;
  Перезагрузить) systemctl reboot ;;
  Выключить) systemctl poweroff ;;
  esac
compatible_with:
  compositor: [hyprland]
  launcher: [fuzzel, rofi]
binds:
  - "$mod SHIFT, E, exec, {{ exec }}"
