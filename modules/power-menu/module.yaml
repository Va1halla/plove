# Модуль power-menu: меню «заблокировать / выйти / перезагрузить / выключить»
# по Super+Shift+E. Своей программы нет: меню рисует лаунчер fuzzel.
id: power-menu
role: power
exec: >-
  case $(printf 'Заблокировать\nВыйти\nПерезагрузить\nВыключить' | fuzzel --dmenu --lines 4 --width 20 --prompt '⏻ ') in
  Заблокировать) pidof hyprlock || hyprlock ;;
  Выйти) hyprctl dispatch exit ;;
  Перезагрузить) systemctl reboot ;;
  Выключить) systemctl poweroff ;;
  esac
compatible_with:
  compositor: [hyprland]
  launcher: [fuzzel]
