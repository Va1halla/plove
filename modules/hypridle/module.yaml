# Модуль hypridle: что делать, когда компьютер простаивает
# (заблокировать экран, потом выключить монитор).
id: hypridle
role: idle
exec: hypridle
packages: [hypridle]
autostart: true
compatible_with:
  compositor: [hyprland]
  lock: [hyprlock]
templates:
  - src: hypridle.conf.tera
    dest: ~/.config/hypr/hypridle.conf
# hypridle не умеет перечитывать конфиг, поэтому перезапускаем его.
reload: "pkill -x hypridle; setsid -f {{ exec }} >/dev/null 2>&1"
process: "hypridle"
settings:
  - id: lock_after
    group: Простой
    title: Блокировать через, мин
    about: Сколько минут без движения мыши и клавиш до блокировки экрана.
    range: [1, 60]
    default: 5
  - id: screen_off_after
    group: Простой
    title: Гасить экран через, мин
    about: Должно быть больше, чем время блокировки.
    range: [1, 120]
    default: 10
