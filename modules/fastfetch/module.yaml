# Модуль fastfetch: сводка о системе с логотипом — обязательный
# кадр любого скриншота райса. Запускается из оболочки при открытии терминала.
id: fastfetch
role: fetch
exec: fastfetch
packages: [fastfetch]
templates:
  - src: config.jsonc.tera
    dest: ~/.config/fastfetch/config.jsonc
# Настройки: мастер показывает их на экране «Тонкая настройка», `plove modules fastfetch` — списком.
settings:
  - id: logo
    group: Сводка
    title: Логотип
    about: full — большой логотип дистрибутива, small — маленький, none — только текст.
    choices: [full, small, none]
    default: full
