# Модуль swww: обои с анимированной сменой. При применении нового райса
# обои меняются плавной волной, а не мгновенно. Альтернатива swaybg.
id: swww
role: wallpaper
# Сам запуск — в скрипте swww.sh: он дожидается демона, а не спит наугад
# секунду (в виртуалке демон бывает медленнее, и обои не ставились).
exec: sh ~/.local/share/plove/swww.sh
packages: [swww]
compatible_with:
  compositor: [hyprland]
autostart: true
stops: [swaybg, hyprpaper]
templates:
  - src: swww.sh.tera
    dest: ~/.local/share/plove/swww.sh
reload: "sh ~/.local/share/plove/swww.sh {{ options.transition }}"
# Фоновый процесс: plove остановит его, если модуль уберут из райса.
process: "swww-daemon"
settings:
  - id: transition
    group: Обои
    title: Анимация смены обоев
    about: Как новые обои появляются при применении райса.
    choices: [grow, outer, wipe, wave, fade, simple, any]
    default: grow
  - id: transition_duration
    group: Обои
    title: Длительность анимации, с
    range: [0.2, 4]
    step: 0.2
    default: 1.2
