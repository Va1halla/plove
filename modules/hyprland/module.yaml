# Модуль Hyprland: тайловый Wayland-композитор.
id: hyprland
role: compositor
exec: Hyprland
# wireplumber (wpctl), brightnessctl и playerctl нужны мультимедийным клавишам,
# pipewire-pulse — модулю громкости в панели.
packages:
  - hyprland
  - xdg-desktop-portal-hyprland
  - pipewire
  - pipewire-pulse
  - wireplumber
  - brightnessctl
  - playerctl
# pipewire-pulse заменяет PulseAudio: pacman предложит удалить старый.
conflicts: [pulseaudio]
templates:
  - src: hyprland.conf.tera
    dest: ~/.config/hypr/hyprland.conf
user_files:
  - ~/.config/hypr/user.conf
reload: hyprctl reload
defaults:
  # snappy — быстрые анимации, smooth — плавные, none — без анимаций.
  animations: snappy
  # Раскладки через запятую, например "us,ru".
  kb_layout: us
  # Как переключать раскладку.
  kb_options: grp:alt_shift_toggle
  # Тени под окнами.
  shadows: true
  # Как перелистываются рабочие столы: slide, slidevert, fade.
  workspace_animation: slide
  # Масштаб интерфейса для всех мониторов: 1, 1.25, 1.5, 2 (для 4K).
  scale: 1
  # Мониторы с точными настройками. Каждый — либо строка в формате Hyprland
  # ("DP-1, 2560x1440@144, 0x0, 1"), либо описание:
  #   - name: DP-1              # имя из `hyprctl monitors`
  #     mode: 2560x1440@144     # по умолчанию лучший режим (preferred)
  #     position: above         # right, left, above, below или точно "0x-1440"
  #     scale: 1.25             # по умолчанию общий scale
  #     rotate: 90              # 0, 90, 180, 270 — вертикальный монитор
  # Неописанные мониторы включаются сами в лучшем режиме и ставятся справа.
  monitors: []
