# Модуль hyprsunset: ночной режим — вечером экран становится тёплым,
# чтобы не резал глаза, утром возвращается обычный цвет.
id: hyprsunset
role: nightlight
exec: hyprsunset
packages: [hyprsunset]
compatible_with:
  compositor: [hyprland]
templates:
  - src: hyprsunset.conf.tera
    dest: ~/.config/hypr/hyprsunset.conf
autostart: true
process: hyprsunset
reload: "pkill -x hyprsunset; setsid -f hyprsunset >/dev/null 2>&1"
settings:
  - id: evening
    group: Ночной режим
    title: Включать в
    about: Время в формате ЧЧ:ММ.
    default: "21:00"
  - id: morning
    group: Ночной режим
    title: Выключать в
    default: "7:00"
  - id: temperature
    group: Ночной режим
    title: Теплота вечером, K
    about: Чем меньше, тем теплее и желтее; обычный цвет — 6500.
    range: [2500, 6000]
    step: 250
    default: 4500
