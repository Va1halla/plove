# Модуль Alacritty: быстрый минималистичный терминал. Альтернатива kitty.
id: alacritty
role: terminal
exec: alacritty
run_in: alacritty -e
packages: [alacritty]
templates:
  - src: alacritty.toml.tera
    dest: ~/.config/alacritty/alacritty.toml
user_files:
  - ~/.config/alacritty/user.toml
# Alacritty сам следит за конфигом и применяет изменения на лету.
binds:
  - "$mod, Return, exec, {{ exec }}"
# Настройки: мастер показывает их на экране «Тонкая настройка», `plove modules alacritty` — списком.
settings:
  - id: cursor_shape
    group: Терминал
    title: Форма курсора
    choices: [block, beam, underline]
    default: block
  - id: cursor_blink
    group: Терминал
    title: Мигающий курсор
    default: true
  - id: padding
    group: Терминал
    title: Отступ текста от края, px
    range: [0, 40]
    step: 2
    default: 8
  - id: colors
    group: Цвета терминала
    title: Цветовая схема
    about: rice — цвета райса. Или любая другая схема, независимо от райса.
    choices: [rice, tokyo-night, catppuccin-mocha, gruvbox, nord, dracula, rose-pine, everforest, kanagawa, one-dark, solarized-dark, catppuccin-latte]
    default: rice
  - id: background
    group: Цвета терминала
    title: Фон
    about: scheme — фон схемы; darker и lighter — темнее или светлее его; rice — фон райса под цветами схемы.
    choices: [scheme, darker, lighter, rice]
    default: scheme
