# Модуль mako: всплывающие уведомления.
id: mako
role: notifications
exec: mako
packages: [mako, libnotify]
autostart: true
# Уведомления может показывать только одна программа.
stops: [swaync, dunst]
compatible_with:
  compositor: [hyprland]
templates:
  - src: config.tera
    dest: ~/.config/mako/config
# Если mako ещё не запущен (райс применён впервые), запускаем его.
reload: "makoctl reload || setsid -f {{ exec }} >/dev/null 2>&1"
process: "mako"
settings:
  - id: anchor
    group: Уведомления
    title: Угол экрана
    choices: [top-right, top-left, bottom-right, bottom-left, top-center]
    default: top-right
  - id: timeout
    group: Уведомления
    title: Сколько висит, мс
    range: [1000, 20000]
    step: 1000
    default: 5000
