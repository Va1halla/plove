# Модуль cliphist: история буфера обмена. Super+Shift+V — выбрать из истории.
id: cliphist
role: clipboard
exec: wl-paste --watch cliphist store
packages: [cliphist, wl-clipboard]
compatible_with:
  compositor: [hyprland]
  launcher: [fuzzel]
# Своего конфига нет; при первом применении запускаем сборщик истории.
reload: "pgrep -f 'cliphist store' >/dev/null || setsid -f {{ exec }} >/dev/null 2>&1"
