# Модуль Waybar: панель сверху или снизу экрана.
id: waybar
role: bar
exec: waybar
packages: [waybar]
compatible_with:
  compositor: [hyprland]
templates:
  - src: config.jsonc.tera
    dest: ~/.config/waybar/config.jsonc
  - src: style.css.tera
    dest: ~/.config/waybar/style.css
  - src: sep.sh.tera
    dest: ~/.local/share/plove/waybar-sep.sh
  - src: calc.sh.tera
    dest: ~/.local/share/plove/calc.sh
reload: pkill -SIGUSR2 waybar
autostart: true
# Фоновый процесс: plove остановит его, если модуль уберут из райса.
process: "waybar"
settings:
  - id: position
    group: Панель
    title: Где панель
    about: left и right — вертикальная панель вдоль края.
    choices: [top, bottom, left, right]
    default: top
  - id: monitors
    group: Панель
    title: На каких мониторах
    about: Имена из `hyprctl monitors`. Пусто — на всех.
    default: []
  - id: bars
    group: Панель
    title: Дополнительные панели
    about: "Ещё панели, например вертикальная на втором мониторе: [{ position: left, monitors: [HDMI-A-1], center: [workspaces] }]. Задаётся в файле райса."
    default: []
  - id: floating
    group: Панель
    title: Отступ от краёв
    about: Панель «парит» с отступами от краёв экрана. То же, что стиль панели floating.
    default: false
  - id: workspace_count
    group: Рабочие столы
    title: Всегда показывать столов
    about: Сколько рабочих столов видно на панели, даже пустых. 0 — только занятые.
    range: [0, 10]
    default: 5
  - id: clock_seconds
    group: Часы
    title: Секунды на часах
    default: false
  - id: clock_date
    group: Часы
    title: Дата рядом с часами
    default: false
  - id: window_length
    group: Модули
    title: Длина заголовка окна
    about: Сколько символов заголовка активного окна показывать.
    range: [10, 80]
    step: 5
    default: 40
  - id: modules_left
    group: Модули
    title: Слева
    about: "Из: launcher, workspaces, window, clock, media, cpu, memory, backlight, pulseaudio, network, battery, language, tray, calculator, power."
    items: [launcher, workspaces, window, clock, media, cpu, memory, backlight, pulseaudio, network, battery, language, tray, calculator, power]
    default: [workspaces]
  - id: modules_center
    group: Модули
    title: По центру
    items: [launcher, workspaces, window, clock, media, cpu, memory, backlight, pulseaudio, network, battery, language, tray, calculator, power]
    default: [clock]
  - id: modules_right
    group: Модули
    title: Справа
    items: [launcher, workspaces, window, clock, media, cpu, memory, backlight, pulseaudio, network, battery, language, tray, calculator, power]
    default: [pulseaudio, network, battery]
  - id: background
    group: Фон панели
    title: Фон
    about: "theme — цвет темы; tint — с оттенком акцента; gradient — переход между двумя цветами; wallpaper — кусок обоев; color и image — свой цвет или картинка (задаются ниже, в файле райса). Прозрачность — из стиля glass. У панели minimal фона нет."
    choices: [theme, tint, gradient, wallpaper, color, image]
    default: theme
  - id: background_color
    group: Фон панели
    title: Свой цвет
    about: "Для color и как первый цвет gradient: #rrggbb. Пусто — по палитре райса."
    default: ""
  - id: background_color2
    group: Фон панели
    title: Второй цвет градиента
    about: "#rrggbb. Пусто — по палитре райса."
    default: ""
  - id: background_image
    group: Фон панели
    title: Картинка
    about: "Путь к картинке для image, например ~/Pictures/bar.png."
    default: ""
