# Модуль Waybar: панель сверху или снизу экрана.
id: waybar
role: bar
exec: waybar
packages: [waybar]
compatible_with:
  compositor: [hyprland]
templates:
  - src: config.jsonc.tera
    dest: ~/.config/waybar/config.jsonc
  - src: style.css.tera
    dest: ~/.config/waybar/style.css
reload: pkill -SIGUSR2 waybar
autostart: true
defaults:
  # top, bottom, left или right (вертикальная панель).
  position: top
  # true — панель «парит» с отступами от краёв. То же, что style.bar: floating.
  floating: false
  # Модули: launcher, workspaces, window, clock, media, cpu, memory, backlight,
  # pulseaudio, network, battery, language, tray, power.
  modules_left: [workspaces]
  modules_center: [clock]
  modules_right: [pulseaudio, network, battery]
# Фоновый процесс: plove остановит его, если модуль уберут из райса.
process: "waybar"
