# Модуль kitty: терминал с поддержкой GPU.
id: kitty
role: terminal
exec: kitty
# kitty запускает программу, переданную после своих аргументов.
run_in: kitty
packages: [kitty]
templates:
  - src: kitty.conf.tera
    dest: ~/.config/kitty/kitty.conf
user_files:
  - ~/.config/kitty/user.conf
# SIGUSR1 заставляет kitty перечитать конфиг во всех окнах.
reload: pkill -SIGUSR1 kitty
binds:
  - "$mod, Return, exec, {{ exec }}"
settings:
  - id: cursor_shape
    group: Терминал
    title: Форма курсора
    choices: [block, beam, underline]
    default: block
  - id: cursor_blink
    group: Терминал
    title: Мигающий курсор
    default: true
  - id: padding
    group: Терминал
    title: Отступ текста от края, px
    range: [0, 40]
    step: 2
    default: 8
  - id: colors
    group: Цвета терминала
    title: Цветовая схема
    about: rice — цвета райса. Или любая другая схема, независимо от райса.
    choices: [rice, tokyo-night, catppuccin-mocha, gruvbox, nord, dracula, rose-pine, everforest, kanagawa, one-dark, solarized-dark, catppuccin-latte]
    default: rice
  - id: background
    group: Цвета терминала
    title: Фон
    about: scheme — фон схемы; darker и lighter — темнее или светлее его; rice — фон райса под цветами схемы.
    choices: [scheme, darker, lighter, rice]
    default: scheme
