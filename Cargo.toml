# Рабочее пространство (workspace) — как solution (.sln) в C#:
# несколько проектов, которые собираются вместе.
[workspace]
resolver = "2"
members = ["crates/plove-core", "crates/plove-preview", "crates/plove-tui", "crates/plove-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tera = { version = "1.20", default-features = false }
include_dir = "0.7"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
fontdue = "0.9"
ratatui = "0.29"
# Картинки в терминале: протокол kitty, sixel, iTerm2 или полублоки.
ratatui-image = { version = "8.1", default-features = false, features = ["crossterm"] }
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.10"
# Чтение картинок для палитры из обоев: PNG, JPEG и WebP.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Библиотеки собираем с оптимизацией даже в debug: иначе рисование
# обоев и превью в тестах идёт в десятки раз медленнее.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Меньше и быстрее бинарник: удобно скачивать на чистую систему.
lto = true
strip = true
